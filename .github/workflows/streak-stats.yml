name: Update streak stats

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours — keep streak SVG fresh
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate live streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=saimawan185&theme=tokyonight&hide_border=true&background=0D1117&stroke=00c6ff&ring=00c6ff&fire=00c6ff&currStreakLabel=00c6ff&disable_animations=true
          path: github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-streak.svg
          if git diff --cached --quiet -- github-streak.svg; then
            echo "No streak SVG changes."
            exit 0
          fi
          git commit -m "chore: refresh live GitHub streak stats"
          git push
